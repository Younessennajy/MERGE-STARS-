# ─── Development overrides ─────────────────────────────────────────────────────
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# What this file adds:
#   • Backend runs with ts-node --watch (hot-reload, no build step needed)
#   • Source code is bind-mounted so edits are reflected instantly
#   • NODE_ENV forced to development (enables TypeORM sync + SQL logs)

services:
  backend:
    build:
      target: development
    command: npm run start:dev
    environment:
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/src:delegated
      - ./backend/.env:/app/.env:ro
    ports:
      - '9229:9229'   # Node.js inspector (--inspect)
