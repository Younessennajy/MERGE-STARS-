# ─── Shared network ────────────────────────────────────────────────────────────
networks:
  merge-stars-net:
    driver: bridge

# ─── Named volumes (persist across restarts) ──────────────────────────────────
volumes:
  postgres_data:

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  # Bundled by default. To use an external database instead, remove this service
  # and set DB_HOST in .env to point to your external server.
  postgres:
    image: postgres:16-alpine
    container_name: merge-stars-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-merge_stars}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5432}:5432'
    networks:
      - merge-stars-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-merge_stars}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (NestJS) ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: merge-stars-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false    # Falls back to inline `environment` values below
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-merge_stars}
      JWT_SECRET: ${JWT_SECRET:-dev-access-secret-change-in-production-min32}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production-min32}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    ports:
      - '${PORT:-3000}:3000'
    networks:
      - merge-stars-net
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # Skip this condition if postgres is not in the active profile
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Frontend (React + Nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: merge-stars-frontend
    restart: unless-stopped
    ports:
      - '8080:80'
    networks:
      - merge-stars-net
    depends_on:
      backend:
        condition: service_healthy
        required: false
